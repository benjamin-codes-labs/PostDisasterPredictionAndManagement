<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Post-typhoon garbage detection and distribution mapping for Macau.">
  <title>Garbage Search</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Mode selection -->
  <div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <button type="button" class="intro__language" data-language-toggle data-i18n="language.toggle"></button>
    <div class="intro__content">
      <h1 class="intro__title" id="intro-title" data-i18n="app.title"></h1>
      <p class="intro__tagline" data-i18n="app.tagline"></p>
      <div class="intro__modes">
        <button type="button" class="intro__mode" data-mode="recognition" data-i18n="intro.recognition"></button>
        <button type="button" class="intro__mode" data-mode="distribution" data-i18n="intro.distribution"></button>
      </div>
      <p class="intro__prompt" data-i18n="intro.prompt"></p>
    </div>
  </div>

  <header class="site-header panel">
    <a class="site-header__brand" href="#top" data-i18n="app.title"></a>
    <nav class="site-nav" data-i18n-aria-label="nav.label">
      <ul class="site-nav__links">
        <li id="nav-recognition" hidden><a href="#recognition" data-i18n="nav.recognition"></a></li>
        <li><a href="#map-section" data-i18n="nav.map"></a></li>
        <li><a href="#forecast" data-i18n="nav.forecast"></a></li>
        <li><a href="#simulation" data-i18n="nav.simulation"></a></li>
        <li><a href="#shelters" data-i18n="nav.shelters"></a></li>
        <li><a href="#guides" data-i18n="nav.guides"></a></li>
      </ul>
    </nav>
    <button type="button" class="button button--small" data-language-toggle data-i18n="language.toggle"></button>
  </header>

  <main class="page" id="top">
    <!-- Weather and air quality -->
    <section class="panel weather-now" aria-live="polite">
      <span class="weather-now__icon" id="weather-now-icon" aria-hidden="true"></span>
      <span id="weather-now-text"></span>
    </section>

    <section class="panel" id="forecast">
      <h2 data-i18n="forecast.title"></h2>
      <div class="forecast-days" id="forecast-days"></div>
      <h3 data-i18n="forecast.today"></h3>
      <p class="card forecast-today" id="forecast-today"></p>
      <h3 data-i18n="forecast.hourly"></h3>
      <div class="forecast-hourly" id="forecast-hourly"></div>
    </section>

    <section class="panel" id="air-quality">
      <h2 class="panel__heading">
        <span data-i18n="airQuality.title"></span>
        <small class="panel__subtitle" data-i18n="airQuality.location"></small>
      </h2>
      <div class="card aqi">
        <div class="aqi__reading">
          <span class="aqi__value" id="aqi-value">--</span>
          <div>
            <p class="aqi__level" id="aqi-level"></p>
            <p class="aqi__pollutants" id="aqi-pollutants"></p>
          </div>
          <button type="button" class="button button--small aqi__refresh" id="aqi-refresh" data-i18n="airQuality.refresh"></button>
        </div>
        <p class="aqi__updated" id="aqi-updated"></p>
      </div>
    </section>

    <!-- Disaster preparedness -->
    <section class="panel" id="simulation">
      <h2 data-i18n="simulation.title"></h2>
      <form class="simulation" id="simulation-form">
        <div class="simulation__fields" id="simulation-fields"></div>
        <div class="button-row">
          <button type="submit" class="button" data-i18n="simulation.apply"></button>
          <button type="button" class="button" id="simulation-random" data-i18n="simulation.random"></button>
        </div>
      </form>
      <p class="simulation__summary" id="simulation-summary" aria-live="polite"></p>
    </section>

    <section class="panel" id="usage">
      <h2 data-i18n="usage.title"></h2>
      <div class="card-grid card-grid--2">
        <article class="card">
          <h3 class="card__title" data-i18n="usage.recognize.title"></h3>
          <ol class="card__list" data-i18n-list="usage.recognize.steps"></ol>
        </article>
        <article class="card">
          <h3 class="card__title" data-i18n="usage.explore.title"></h3>
          <ol class="card__list" data-i18n-list="usage.explore.steps"></ol>
        </article>
      </div>
    </section>

    <section class="panel" id="shelters">
      <h2 data-i18n="shelters.title"></h2>
      <div class="card-grid card-grid--4" id="shelter-list"></div>
      <p class="note" data-i18n="shelters.note"></p>
    </section>

    <!-- Garbage recognition and mapping -->
    <div class="workspace" id="workspace">
      <section class="panel camera" id="recognition" hidden>
        <h2 data-i18n="camera.title"></h2>
        <video class="camera__preview" id="camera-preview" autoplay playsinline muted></video>
        <div class="button-row button-row--center">
          <button type="button" class="button" id="camera-start" data-i18n="camera.start"></button>
          <button type="button" class="button" id="camera-capture" data-i18n="camera.capture" disabled></button>
          <button type="button" class="button" id="camera-reset" data-i18n="camera.reset" disabled></button>
        </div>
        <p class="camera__result" id="camera-result" aria-live="polite"></p>
        <p class="hint" data-i18n="camera.hint"></p>
      </section>

      <section class="panel" id="map-section">
        <div class="map-header">
          <h2 data-i18n="map.title"></h2>
          <button type="button" class="button button--warning" id="heatmap-toggle" data-i18n="map.showHeatmap" aria-pressed="false"></button>
        </div>
        <fieldset class="category-filters" id="category-filters">
          <legend class="visually-hidden" data-i18n="map.filterLegend"></legend>
        </fieldset>
        <div class="garbage-map" id="garbage-map"></div>
        <div class="button-row">
          <button type="button" class="button" id="report-random" data-i18n="map.randomReport"></button>
          <button type="button" class="button" id="csv-import" data-i18n="map.import"></button>
          <button type="button" class="button button--success" id="csv-export" data-i18n="map.export"></button>
          <input type="file" id="csv-import-input" accept=".csv,text/csv" hidden>
        </div>
        <p class="map-status" id="map-status" role="status"></p>
        <p class="hint" data-i18n="map.hint"></p>

        <h2 class="districts-title" data-i18n="districts.title"></h2>
        <div id="district-maps"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <section class="panel" id="guides">
      <h2 data-i18n="guides.title"></h2>
      <div class="card-grid card-grid--3">
        <article class="card">
          <h3 class="card__title" data-i18n="guides.earthquake.title"></h3>
          <ul class="card__list" data-i18n-list="guides.earthquake.tips"></ul>
        </article>
        <article class="card">
          <h3 class="card__title" data-i18n="guides.flood.title"></h3>
          <ul class="card__list" data-i18n-list="guides.flood.tips"></ul>
        </article>
        <article class="card">
          <h3 class="card__title" data-i18n="guides.typhoon.title"></h3>
          <ul class="card__list" data-i18n-list="guides.typhoon.tips"></ul>
        </article>
        <article class="card">
          <h3 class="card__title" data-i18n="guides.wildfire.title"></h3>
          <ul class="card__list" data-i18n-list="guides.wildfire.tips"></ul>
        </article>
        <article class="card">
          <h3 class="card__title" data-i18n="guides.heat.title"></h3>
          <ul class="card__list" data-i18n-list="guides.heat.tips"></ul>
        </article>
        <article class="card">
          <h3 class="card__title" data-i18n="guides.disease.title"></h3>
          <ul class="card__list" data-i18n-list="guides.disease.tips"></ul>
        </article>
      </div>
    </section>
  </footer>
</body>
</html>
